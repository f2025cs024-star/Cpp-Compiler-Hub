version: '3.8'

services:
  api:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - JWT_SECRET=nexcpp_secret_key_2024
    volumes:
      - ./server:/app
      - /var/run/docker.sock:/var/run/docker.sock # For spawning sandbox containers
    depends_on:
      - sandbox-image

  sandbox-image:
    build:
      context: ./server/docker
      dockerfile: Dockerfile.sandbox
    image: nexcpp-sandbox
    # This service doesn't run, it just builds the image
