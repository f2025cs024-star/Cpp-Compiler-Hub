# Render Blueprint: https://render.com/docs/blueprint-spec
# Push this file, then in Render: New → Blueprint → connect the repo (or apply from repo settings).

services:
  - type: web
    name: cppcompilerhub
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Set in dashboard to your live HTTPS URL, e.g. https://nexcpp.onrender.com
      - key: CORS_ORIGIN
        sync: false
