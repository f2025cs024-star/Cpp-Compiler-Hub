[package]
name = "nexcpp"
version = "1.0.0"
description = "NexCPP — Professional C++ Online Compiler"
authors = ["NexCPP Team"]
license = ""
repository = "https://github.com/f2025cs024-star/nexcpp-deploy"
default-run = "nexcpp"
edition = "2021"
rust-version = "1.60"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.6", features = ["shell-open"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
