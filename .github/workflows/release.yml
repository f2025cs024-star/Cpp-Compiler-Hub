name: NexCPP Native Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────
  # 1. Windows x64 Build (NSIS Installer)
  # ─────────────────────────────────────────────
  build-windows-x64:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Frontend Dependencies
        run: |
          cd client
          npm install --legacy-peer-deps

      - name: Build Tauri App (x64)
        run: |
          cd client
          npx tauri build --target x86_64-pc-windows-msvc
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Prepare Artifacts
        run: |
          mkdir artifacts
          cp client/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe artifacts/NexCPP-Setup-x64.exe
          cp client/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi artifacts/NexCPP-Setup-x64.msi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: artifacts/

  # ─────────────────────────────────────────────
  # 2. Windows ARM64 Build
  # ─────────────────────────────────────────────
  build-windows-arm64:
    name: Windows ARM64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Install Frontend Dependencies
        run: |
          cd client
          npm install --legacy-peer-deps

      - name: Build Tauri App (ARM64)
        run: |
          cd client
          npx tauri build --target aarch64-pc-windows-msvc
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Prepare Artifacts
        run: |
          mkdir artifacts
          cp client/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe artifacts/NexCPP-Setup-arm64.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64
          path: artifacts/

  # ─────────────────────────────────────────────
  # 3. Linux x64 Build (AppImage + Deb)
  # ─────────────────────────────────────────────
  build-linux-x64:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        run: |
          cd client
          npm install --legacy-peer-deps

      - name: Build Tauri App (Linux x64)
        run: |
          cd client
          npx tauri build

      - name: Prepare Artifacts
        run: |
          mkdir artifacts
          cp client/src-tauri/target/release/bundle/appimage/*.AppImage artifacts/NexCPP-linux-x64.AppImage
          cp client/src-tauri/target/release/bundle/deb/*.deb artifacts/NexCPP-linux-x64.deb

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: artifacts/

  # ─────────────────────────────────────────────
  # 4. Android Build (ARM64 + x86_64)
  # ─────────────────────────────────────────────
  build-android:
    name: Android APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        run: |
          cd client
          npm install --legacy-peer-deps

      - name: Build Web Assets
        run: |
          cd client
          npm run build

      - name: Sync Capacitor
        run: |
          cd client
          npx cap sync android

      - name: Build Android APK
        run: |
          cd client/android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign APK (ARM64)
        uses: r0adkll/sign-android-release@v1
        id: sign_app_arm64
        with:
          releaseDirectory: client/android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Prepare Artifacts
        run: |
          mkdir artifacts
          cp client/android/app/build/outputs/apk/release/app-arm64-v8a-release.apk artifacts/NexCPP-arm64.apk || cp client/android/app/build/outputs/apk/release/app-release.apk artifacts/NexCPP-arm64.apk
          cp client/android/app/build/outputs/apk/release/app-x86_64-release.apk artifacts/NexCPP-x86_64.apk || echo "x86_64 apk not found"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: artifacts/

  # ─────────────────────────────────────────────
  # 5. Create GitHub Release
  # ─────────────────────────────────────────────
  publish:
    name: Publish Release
    needs: [build-windows-x64, build-windows-arm64, build-linux-x64, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: true

      - name: Generate SHA256
        run: |
          cd all-artifacts
          for f in *; do sha256sum "$f" > "$f.sha256" || true; done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: NexCPP ${{ github.ref_name }}
          body: |
            ## 🚀 NexCPP ${{ github.ref_name }} Native Release

            Professional C++ IDE for Desktop and Mobile.

            ### Installation Instructions
            - **Windows**: Run `NexCPP-Setup-x64.exe` to install.
            - **Android**: Install the `.apk` file on your phone.
            - **Linux**: Make the `.AppImage` executable and run it.

            *SHA256 checksums are attached for verification.*
          files: |
            all-artifacts/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
